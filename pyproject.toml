[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "django"
line_length = 100
skip_gitignore = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
pythonpath = ["backend"]
python_files = ["test_*.py", "*_test.py"]
testpaths = ["backend/tests"]
