<!-- Batch Contact Deletion Confirmation Modal Partial (T042) -->
<div
  id="batch-delete-modal"
  class="modal-backdrop"
  role="dialog"
  aria-modal="true"
  aria-hidden="true"
  aria-labelledby="batch-delete-modal-title"
>
  <div class="modal-dialog">
    <div class="modal-header">
      <h2 id="batch-delete-modal-title" class="modal-title">Delete Selected Contacts</h2>
      <button
        type="button"
        class="alert-close"
        aria-label="Close modal"
        data-contact-modal-close="batch-delete-modal"
      >
        &times;
      </button>
    </div>
    <div class="modal-body">
      <p id="batch-delete-modal-message">
        Are you sure you want to delete the selected contacts? This action cannot be undone.
      </p>
    </div>
    <div class="modal-footer">
      <button
        type="button"
        class="btn btn-secondary"
        data-contact-modal-close="batch-delete-modal"
      >
        Cancel
      </button>
      <form id="batch-delete-modal-form" method="post" action="{% url 'contacts:batch_delete' %}">
        {% csrf_token %}
        <input type="hidden" name="confirm" value="true" />
        <div id="batch-delete-hidden-ids"></div>
        <button type="submit" class="btn btn-danger">Confirm Batch Delete</button>
      </form>
    </div>
  </div>
</div>
