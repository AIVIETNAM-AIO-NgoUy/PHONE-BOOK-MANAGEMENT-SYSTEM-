<!-- Group Deletion Confirmation Modal Partial (T086) -->
<div
  id="delete-group-modal"
  class="modal-backdrop"
  role="dialog"
  aria-modal="true"
  aria-hidden="true"
  aria-labelledby="delete-group-modal-title"
>
  <div class="modal-dialog">
    <div class="modal-header">
      <h2 id="delete-group-modal-title" class="modal-title">Delete Group</h2>
      <button
        type="button"
        class="alert-close"
        aria-label="Close modal"
        data-group-modal-close="delete-group-modal"
      >
        &times;
      </button>
    </div>
    <div class="modal-body">
      <p id="delete-group-modal-message" style="margin-top: 0;">
        Are you sure you want to delete this group?
      </p>
      <div class="alert alert-info" style="margin-bottom: 0;">
        <span>
          <strong>Contact Preservation Guarantee:</strong> Deleting this group will remove the
          group container and its membership links only. All member contacts and their phone
          numbers will <strong>NOT</strong> be deleted from your contact book.
        </span>
      </div>
    </div>
    <div class="modal-footer">
      <button
        type="button"
        class="btn btn-secondary"
        data-group-modal-close="delete-group-modal"
      >
        Cancel
      </button>
      <form id="delete-group-modal-form" method="post" action="">
        {% csrf_token %}
        <input type="hidden" name="confirm" value="true" />
        <button type="submit" class="btn btn-danger">Confirm Delete Group</button>
      </form>
    </div>
  </div>
</div>
