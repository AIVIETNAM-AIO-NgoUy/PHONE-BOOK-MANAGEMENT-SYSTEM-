services:
  db:
    image: postgres:16-alpine
    container_name: phonebook_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-phonebook_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secretpassword}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-phonebook_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: .
    container_name: phonebook_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - staticfiles_data:/app/backend/staticfiles
      - media_data:/app/backend/media
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.base
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-django-insecure-local-docker-dev-key}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088,http://192.168.2.70:8088,https://*.ngrok-free.app,https://*.ngrok.io,https://*.trycloudflare.com}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-phonebook_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secretpassword}
      DB_HOST: db
      DB_PORT: "5432"
      CONN_MAX_AGE: "60"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      GUNICORN_BIND: 0.0.0.0:8000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: phonebook_nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8088}:80"
    volumes:
      - ./deploy/nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  staticfiles_data:
  media_data:
